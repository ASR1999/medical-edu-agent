version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: medical-agent-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - FHIR_BASE_URL=http://hapi-fhir:8080/fhir
    depends_on:
      - hapi-fhir
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://backend:8000/api
    container_name: medical-agent-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

  hapi-fhir:
    image: hapiproject/hapi:latest
    container_name: medical-agent-fhir
    ports:
      - "8080:8080"
    environment:
      - HAPI_FHIR_ALLOW_EXTERNAL_REFERENCES=true
      - HAPI_FHIR_ALLOW_MULTIPLE_DELETE=true
      - HAPI_FHIR_REUSE_CACHED_SEARCH_RESULTS_MILLIS=60000
    restart: unless-stopped



